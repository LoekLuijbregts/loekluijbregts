  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/brand-system.css">
  <style>
    body.scan-page { background: var(--brand-surface); }
    .scan-page main { padding: 48px 0 72px; }
    .scan-intro { margin: 0 auto 30px; max-width: 720px; text-align: center; }
    .scan-intro h1 { font-size: clamp(38px, 5vw, 58px); line-height: 1.04; margin-top: 12px; }
    .scan-intro p { color: var(--brand-body); font-size: 18px; margin: 18px auto 0; max-width: 620px; }
    .scan-meta { color: var(--brand-muted); font-size: 13px; font-weight: 600; margin-top: 14px; }
    .scan-frame {
      background: var(--brand-white);
      border: 1px solid var(--brand-border);
      border-radius: 18px;
      box-shadow: var(--brand-shadow);
      margin: 0 auto;
      max-width: 1120px;
      min-height: 720px;
      overflow: hidden;
    }
    .scan-frame [data-sa-view="full"] { min-height: 720px; width: 100%; }
    .scan-back { color: var(--brand-body); font-size: 13px; font-weight: 600; text-decoration: none; }
    .scan-back:hover { color: var(--brand-blue); }
    .scan-fallback { padding: 32px; text-align: center; }
    @media (max-width: 700px) {
      .scan-page main { padding: 32px 0 44px; }
      .scan-intro { margin-bottom: 22px; }
      .scan-intro h1 { font-size: clamp(34px, 10vw, 42px); }
      .scan-intro p { font-size: 16px; line-height: 1.6; }
      .scan-frame { border-left: 0; border-radius: 0; border-right: 0; box-shadow: none; min-height: 760px; }
      .scan-frame [data-sa-view="full"] { min-height: 760px; }
    }
  </style>
<style data-brand-assets>.site-brand-logo{display:flex;align-items:center}.site-logo-full{display:block;width:220px;height:auto}.site-logo-mark{display:none;width:36px;height:36px}@media(max-width:620px){.site-logo-full{display:none}.site-logo-mark{display:block}}</style>
</head>
<body class="scan-page">
  <nav aria-label="Hoofdnavigatie">
    <div class="wrap nav-inner">
      <a class="brand mono" href="/" aria-label="Loek Luijbregts homepage"><span class="site-brand-logo"><img class="site-logo-full" src="/images/logo-primary-horizontal.png" alt="Loek Luijbregts" width="1800" height="432"><img class="site-logo-mark" src="/images/logo-mark.svg" alt="" width="128" height="128" aria-hidden="true"></span></a>
      <a class="scan-back" href="/">Terug naar de website</a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <header class="scan-intro">
        <div class="eyebrow mono">Gratis MKB-scan</div>
        <h1>Wat verdient nu echt <em>aandacht?</em></h1>
        <p>Beantwoord 12 korte vragen. Je krijgt direct een eerste beeld van waar waarde, richting of commerciële kansen onnodig blijven liggen.</p>
        <div class="scan-meta">12 vragen · 3 onderdelen · minder dan 3 minuten</div>
      </header>

      <section class="scan-frame" aria-label="Gratis MKB-scan">
        <div data-sa-url="https://259e47c2-c001-4ac9-9f7d-acdf0c4abcd9.scoreapp.com/?sa_target=_top" data-sa-view="full"><script src="https://static.scoreapp.com/js/integration/v1/embedding.js?v=gQM-7i"></script></div>
        <noscript><p class="scan-fallback">JavaScript is nodig om de scan hier te tonen. <a href="https://mkb-scan.scoreapp.com">Open de MKB-scan rechtstreeks</a>.</p></noscript>
      </section>
    </div>
  </main>
</body>
</html>
